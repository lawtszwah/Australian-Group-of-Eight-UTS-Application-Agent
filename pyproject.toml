[project]
name = "go8agent"
version = "0.1.0"
description = "澳洲八大 + UTS 本硕申请 agent —— 数据层与选校推理"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "openai>=1.60",      # DeepSeek 走 OpenAI 兼容接口
    "anthropic>=1.3",    # 可选的另一个供应商，用于评估对比
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
go8agent = "go8agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/go8agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
